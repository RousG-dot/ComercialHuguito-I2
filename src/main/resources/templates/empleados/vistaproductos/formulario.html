<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario de Medicamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/vistaproductos.css}">
</head>
<body>
<!-- Navbar superior -->
<div id="navbar-container"></div>
<script th:src="@{/js/empleados/navbarempl.js}"></script>


<div class="container mt-4">
    <div class="form-container animate__animated animate__fadeIn">
        <h2 class="page-title" th:text="${productos.id == null} ? 'Nuevo Producto' : 'Editar Producto'"></h2>
        <form th:action="@{/empleados/vistaproductos/guardar}" th:object="${productos}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3 animate__animated animate__fadeInUp" style="animation-delay: 0.1s">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required>
            </div>

            <div class="mb-3 animate__animated animate__fadeInUp" style="animation-delay: 0.2s">
                <label class="form-label">Descripción</label>
                <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
            </div>

            <div class="mb-3 animate__animated animate__fadeInUp" style="animation-delay: 0.3s">
                <label class="form-label">Cantidad</label>
                <input type="number" th:field="*{cantidad}" class="form-control" required>
            </div>

            <div class="mb-3 animate__animated animate__fadeInUp" style="animation-delay: 0.4s">
                <label class="form-label">Precio</label>
                <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Proveedor</label>
                <select class="form-select" th:field="*{proveedor.id}">
                    <option th:each="prov : ${proveedores}"
                            th:value="${prov.id}"
                            th:text="${prov.nombreEmpresa}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Imagen</label>
                <input type="file" name="imagenFile" class="form-control" accept="image/*">
            </div>

            <div class="mt-4 animate__animated animate__fadeInUp" style="animation-delay: 0.5s">
                <button type="submit" class="btn btn-success me-2">Guardar</button>
                <a href="/empleados/vistaproductos" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.getElementById('productoForm').addEventListener('submit', function(e) {
        e.preventDefault();
        Swal.fire({
            title: '¿Guardar cambios?',
            text: "¿Estás seguro de guardar los cambios?",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#2c7e91',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Sí, guardar',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                this.submit();
            }
        });
    });
</script>
<script src="/js/panelgeneral.js"></script>
</body>
</html>
