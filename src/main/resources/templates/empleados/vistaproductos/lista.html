<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Medicamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/vistaproductos.css}">
</head>
<body>
<!-- Navbar superior -->
<div id="navbar-container"></div>
<script th:src="@{/js/empleados/navbarempl.js}"></script>


<!-- templates/empleados/vistaproductos/lista.html -->
<div class="container mt-4 animate__animated animate__fadeIn">
    <h2 class="page-title">Lista de Productos</h2>
    <a href="/empleados/vistaproductos/nuevo" class="btn btn-add mb-3 animate__animated animate__fadeInRight">
        <i class="bi bi-plus-circle me-2"></i>Agregar Producto
    </a>
    <div class="table-container">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Proveedor</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="prod : ${productos}">
                <td><img th:src="@{'/uploads/' + ${prod.imagen}}" width="80" height="80" alt="Sin imagen"></td>
                <td th:text="${prod.nombre}"></td>
                <td th:text="${prod.descripcion}"></td>
                <td th:text="${prod.cantidad}"></td>
                <td th:text="${prod.precio}"></td>
                <td th:text="${prod.proveedor.nombreEmpresa}"></td>
                <td class="action-buttons">
                    <a th:href="@{'/empleados/vistaproductos/editar/' + ${prod.id}}" class="btn btn-warning btn-sm">
                        <i class="bi bi-pencil"></i> Editar
                    </a>
                    <a th:href="@{'/empleados/vistaproductos/eliminar/' + ${prod.id}}" class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Está seguro de eliminar este producto?')">
                        <i class="bi bi-trash"></i> Eliminar
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    function eliminarProducto(id) {
      Swal.fire({
          title: '¿Estás seguro?',
          text: "Esta acción no se puede revertir",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#2c7e91',
          cancelButtonColor: '#d33',
          confirmButtonText: 'Sí, eliminar',
          cancelButtonText: 'Cancelar',
          background: '#fff',
          customClass: {
              confirmButton: 'btn btn-primary',
              cancelButton: 'btn btn-danger'
          }
      }).then((result) => {
          if (result.isConfirmed) {
              window.location.href = `/administrador/productos/eliminar/${id}`;
          }
      });
    }
</script>
<script src="/js/panelgeneral.js"></script>
</body>
</html>
