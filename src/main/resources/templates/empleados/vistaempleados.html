<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/vistaempleados.css}">
</head>
<body>
<!-- Navbar superior -->
<div id="navbar-container"></div>
<script th:src="@{/js/empleados/navbarempl.js}"></script>

<!-- Contenido -->
<div class="container mt-4">
    <div class="text-center">
        <h2>Bienvenido al Panel de Gestion</h2>
    </div>

    <div class="row g-4 mt-3">
        <div class="col-md-6 col-lg-3">
            <div class="card p-3">
                <h5><i class="bi bi-person-badge-fill"></i> Empleados</h5>
                <p>Activos: <span th:text="${totalEmpleados}">0</span></p>
            </div>
        </div>
        <div class="col-md-6 col-lg-3">
            <div class="card p-3">
                <h5><i class="bi bi-bag-dash-fill"></i> Productos</h5>
                <p>En stock: <span th:text="${totalProductos}">0</span></p>
            </div>
        </div>
        <div class="col-md-6 col-lg-3">
            <div class="card p-3">
                <h5><i class="bi bi-people-fill"></i> Clientes</h5>
                <p>Registrados: <span th:text="${totalClientes}">0</span></p>
            </div>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-md-6">
            <h5 class="text-center">Productos Agregados Últimas Semanas</h5>
            <canvas id="medicamentosChart" height="200"></canvas>
        </div>
        <div class="col-md-6">
            <h5 class="text-center">Clientes Registrados Últimas Semanas</h5>
            <canvas id="pacientesChart" height="200"></canvas>
        </div>
    </div>
</div>
<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('d-none');
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const pacientesData = /*[[${pacientesPorSemana}]]*/ {};
    const medicamentosData = /*[[${medicamentosPorSemana}]]*/ {};
    /*]]>*/

    const pacientesLabels = Object.keys(pacientesData);
    const pacientesValues = Object.values(pacientesData);

    const medicamentosLabels = Object.keys(medicamentosData);
    const medicamentosValues = Object.values(medicamentosData);

    new Chart(document.getElementById('pacientesChart'), {
      type: 'line',
      data: {
        labels: pacientesLabels,
        datasets: [{
          label: 'Pacientes',
          data: pacientesValues,
          borderColor: 'rgb(54, 162, 235)',
          fill: false,
          tension: 0.1
        }]
      }
    });

    new Chart(document.getElementById('medicamentosChart'), {
      type: 'bar',
      data: {
        labels: medicamentosLabels,
        datasets: [{
          label: 'Medicamentos',
          data: medicamentosValues,
          backgroundColor: 'rgba(255, 99, 132, 0.6)',
          borderColor: 'rgba(255, 99, 132, 1)',
          borderWidth: 1
        }]
      }
    });
</script>
<script src="/js/panelgeneral.js"></script>
</body>
</html>
