<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/paneladministrador.css}">
</head>
<body>
<!-- Navbar superior -->
<div id="navbar-container"></div>
<script th:src="@{/js/administrador/navbaradmin.js}"></script>

<div class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
        <h2>Lista de Empleados</h2>
        <a href="/administrador/panelempleados/nuevo" class="btn btn-primary">Nuevo Empleado</a>
        <a href="/administrador/panelempleados/exportar-pdf" class="btn btn-danger">Exportar PDF</a>
        <a href="/administrador/panelempleados/exportar-excel" class="btn btn-success">Exportar Excel</a>
    </div>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombres</th>
            <th>Apellidos</th>
            <th>DNI</th>
            <th>Fecha de Nacimiento</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Dirección</th>
            <th>Cargo</th>
            <th>Sueldo</th>
            <th>Fecha de Contratación</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="empleado : ${empleados}">
            <td th:text="${empleado.id}"></td>
            <td th:text="${empleado.nombres}"></td>
            <td th:text="${empleado.apellidos}"></td>
            <td th:text="${empleado.dni}"></td>
            <td th:text="${empleado.fechaNacimiento}"></td>
            <td th:text="${empleado.correo}"></td>
            <td th:text="${empleado.telefono}"></td>
            <td th:text="${empleado.direccion}"></td>
            <td th:text="${empleado.cargo}"></td>
            <td th:text="${empleado.sueldo}"></td>
            <td th:text="${empleado.fechaContratacion}"></td>
            <td>
                <a th:href="@{/administrador/panelempleados/editar/{id}(id=${empleado.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/administrador/panelempleados/eliminar/{id}(id=${empleado.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Estás seguro de eliminar este empleado?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/panelgeneral.js"></script>
</body>
</html>
