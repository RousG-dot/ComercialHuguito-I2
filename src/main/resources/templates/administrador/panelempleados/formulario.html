<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/paneladministrador.css}">
</head>
<body>
<!-- Navbar superior -->
<div id="navbar-container"></div>
<script th:src="@{/js/administrador/navbaradmin.js}"></script>

<div class="container mt-4">
    <div class="form-container animate__animated animate__fadeIn">
        <h2 class="page-title" th:text="${empleado.id == null} ? 'Nuevo Empleado' : 'Editar Empleado'"></h2>

        <form th:action="@{/administrador/panelempleados/guardar}" th:object="${empleado}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Nombres</label>
                <input type="text" th:field="*{nombres}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Apellidos</label>
                <input type="text" th:field="*{apellidos}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">DNI</label>
                <input type="text" th:field="*{dni}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha de Nacimiento</label>
                <input type="date" th:field="*{fechaNacimiento}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" th:field="*{correo}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" th:field="*{contrasena}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" th:field="*{telefono}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Dirección</label>
                <input type="text" th:field="*{direccion}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Cargo</label>
                <select th:field="*{cargo}" class="form-control" required>
                    <option value="">-- Seleccione un cargo --</option>
                    <option value="almacenero">Almacenero</option>
                    <option value="analista">Analista</option>
                    <option value="repartidor">Repartidor</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Sueldo</label>
                <input type="number" step="0.01" th:field="*{sueldo}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha de Contratación</label>
                <input type="date" th:field="*{fechaContratacion}" class="form-control" required>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-success me-2">Guardar</button>
                <a th:href="@{/administrador/panelempleados}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/js/panelgeneral.js"></script>
</body>
</html>
