<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comercial Huguito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>

<!-- Navbar -->
<div id="navbar"></div>
<script th:src="@{/js/cliente/navbar.js}"></script>

<!-- Sección con banner rotativo -->
<div id="slider"></div>
<script th:src="@{/js/cliente/slider2.js}"></script>

<!-- Filtro de búsqueda y orden -->
<div class="container py-4">
    <div class="row mb-4 align-items-center g-3">
        <div class="col-md-5">
            <div class="input-group shadow-sm animate__animated animate__fadeInLeft">
        <span class="input-group-text bg-primary text-white">
          <i class="bi bi-search"></i>
        </span>
                <input type="text" id="busquedaNombre" class="form-control" placeholder="Buscar por nombre">
            </div>
        </div>
        <div class="col-md-5">
            <div class="input-group shadow-sm animate__animated animate__fadeInRight">
        <span class="input-group-text bg-primary text-white">
          <i class="bi bi-funnel"></i>
        </span>
                <select id="filtroPrecio" class="form-select">
                    <option value="">Ordenar por precio</option>
                    <option value="menor">Precio menor</option>
                    <option value="mayor">Precio mayor</option>
                </select>
            </div>
        </div>
    </div>
</div>

<div class="container py-5">
    <h2 class="text-center mb-5 animate-on-scroll">Nuestros Productos</h2>

    <div class="row g-4" id="productosContainer">
        <div class="col-md-3" th:each="producto : ${productos}">
            <div class="card service-card producto-card h-100"
                 th:attr="data-nombre=${producto.nombre},
                           data-descripcion=${producto.descripcion},
                           data-precio=${producto.precio},
                           data-imagen=@{'/uploads/' + ${producto.imagen}}">
                <img th:src="@{'/uploads/' + ${producto.imagen}}" class="card-img-top" th:alt="${producto.nombre}">
                <div class="card-body text-center">
                    <h5 class="card-title" th:text="${producto.nombre}">Nombre</h5>
                    <p class="card-text text-success fw-bold">S/. <span th:text="${producto.precio}">0.00</span></p>
                    <button class="btn btn-primary mb-1" onclick="abrirModal(this)">Ver más</button>
                    <button class="btn btn-outline-success agregar-carrito" data-id="[[${producto.id}]]">Agregar al carrito</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="productoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content producto-modal">
            <div class="modal-header">
                <h5 class="modal-title" id="modalNombre"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body d-flex flex-column align-items-center">
                <img id="modalImagen" class="img-fluid rounded mb-3" alt="Imagen del producto">
                <p id="modalDescripcion"></p>
                <h5 class="text-success fw-bold">S/. <span id="modalPrecio"></span></h5>
                <button class="btn btn-outline-success agregar-carrito">Agregar al carrito</button>
                <button class="btn btn-primary mt-2">Comprar</button>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div id="footer-container"></div>
<script src="/js/cliente/footer.js"></script>


<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="/js/cliente/servicioslider2.js"></script>
<script th:src="@{/js/cliente/modalservicios.js}"></script>
<script>
    // Animación al hacer scroll
    const observerOptions = {
      threshold: 0.1
    };

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, observerOptions);

    document.querySelectorAll('.animate-on-scroll').forEach(element => {
      observer.observe(element);
    });
</script>
</body>
</html>
