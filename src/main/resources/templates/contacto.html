<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comercial Huguito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>

<!-- Navbar -->
<div id="navbar"></div>
<script th:src="@{/js/cliente/navbar.js}"></script>

<!-- Sección con banner rotativo -->
<div id="slider"></div>
<script th:src="@{/js/cliente/slider3.js}"></script>

<!-- Formulario de Contacto -->
<div id="contacto-container"></div>
<script src="/js/cliente/contacto.js"></script>
<br><br><br><br>

<!-- Footer -->
<div id="footer-container"></div>
<script src="/js/cliente/footer.js"></script>


<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="/js/cliente/contactoslider3.js"></script>
<script>
    // Animación al hacer scroll
    const observerOptions = {
      threshold: 0.1
    };

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, observerOptions);

    document.querySelectorAll('.animate-on-scroll').forEach(element => {
      observer.observe(element);
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
      const forms = document.querySelectorAll(".needs-validation");

      Array.from(forms).forEach(form => {
        form.addEventListener("submit", function (event) {
          if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
          } else {
            alert("Formulario enviado correctamente 🚀");
          }
          form.classList.add("was-validated");
        }, false);
      });
    });
</script>

</body>
</html>
